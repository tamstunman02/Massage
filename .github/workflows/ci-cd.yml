name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: massage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: massage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d massage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Boot API against Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/massage
          APP_URL: http://127.0.0.1:3001
          PORT: 3001
        run: |
          set -euo pipefail
          node server/index.js > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3001/api/me >/dev/null; then
              echo "API is up"
              kill "$(cat server.pid)" || true
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat server.log
          exit 1

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Update server and restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_DIR,SSH_PASSWORD
          command_timeout: 18m
          script: |
            set -euo pipefail
            run_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                printf '%s\n' "$SSH_PASSWORD" | sudo -S -p '' "$@"
              fi
            }
            mem_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
            swap_kb=$(awk '/SwapTotal:/ {print $2}' /proc/meminfo)
            if [ "$mem_kb" -lt 2000000 ] && [ "$swap_kb" -lt 800000 ]; then
              echo "Memory is ${mem_kb} kB with ${swap_kb} kB swap; adding 1G swap so npm is not killed"
              if [ ! -f /swapfile ]; then
                run_root fallocate -l 1G /swapfile || run_root dd if=/dev/zero of=/swapfile bs=1M count=1024
                run_root chmod 600 /swapfile
                run_root mkswap /swapfile
              fi
              run_root swapon /swapfile || true
            fi
            cd "${APP_DIR:-/var/www/nuania}"
            git fetch origin main
            git reset --hard origin/main
            export NODE_OPTIONS="--max-old-space-size=512"
            npm ci --no-audit --no-fund --foreground-scripts
            npm run build
            app_dir="${APP_DIR:-/var/www/nuania}"
            node_bin=$(command -v node)
            service_user=$(id -un)
            service_group=$(id -gn)
            if [ "$service_user" = root ] && id massage >/dev/null 2>&1; then
              service_user=massage
              service_group=massage
            fi
            unit_tmp=$(mktemp)
            sed \
              -e "s|^User=.*|User=${service_user}|" \
              -e "s|^Group=.*|Group=${service_group}|" \
              -e "s|^WorkingDirectory=.*|WorkingDirectory=${app_dir}|" \
              -e "s|^EnvironmentFile=.*|EnvironmentFile=-${app_dir}/.env|" \
              -e "s|^ExecStart=.*|ExecStart=${node_bin} server/index.js|" \
              deploy/massage.service > "$unit_tmp"
            run_root cp "$unit_tmp" /etc/systemd/system/massage.service
            rm -f "$unit_tmp"
            run_root systemctl daemon-reload
            run_root systemctl enable massage
            run_root systemctl restart massage
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3001/api/me >/dev/null; then
                echo "Deployed and API is up"
                exit 0
              fi
              sleep 2
            done
            echo "Service did not become ready"
            if [ "$(id -u)" -eq 0 ]; then
              systemctl status massage --no-pager || true
            else
              printf '%s\n' "$SSH_PASSWORD" | sudo -S -p '' systemctl status massage --no-pager || true
            fi
            exit 1
