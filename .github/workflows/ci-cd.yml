name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: massage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: massage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d massage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Boot API against Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/massage
          APP_URL: http://127.0.0.1:3001
          PORT: 3001
        run: |
          set -euo pipefail
          node server/index.js > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3001/api/me >/dev/null; then
              echo "API is up"
              kill "$(cat server.pid)" || true
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat server.log
          exit 1

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Update server and restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_DIR,SSH_PASSWORD
          command_timeout: 18m
          script: |
            set -euo pipefail
            run_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                printf '%s\n' "$SSH_PASSWORD" | sudo -S -p '' "$@"
              fi
            }
            mem_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
            swap_kb=$(awk '/SwapTotal:/ {print $2}' /proc/meminfo)
            if [ "$mem_kb" -lt 2000000 ] && [ "$swap_kb" -lt 800000 ]; then
              echo "Memory is ${mem_kb} kB with ${swap_kb} kB swap; adding 1G swap so npm is not killed"
              if [ ! -f /swapfile ]; then
                run_root fallocate -l 1G /swapfile || run_root dd if=/dev/zero of=/swapfile bs=1M count=1024
                run_root chmod 600 /swapfile
                run_root mkswap /swapfile
              fi
              run_root swapon /swapfile || true
            fi
            cd "${APP_DIR:-/var/www/nuania}"
            git fetch origin main
            git reset --hard origin/main
            export NODE_OPTIONS="--max-old-space-size=512"
            npm ci --no-audit --no-fund --foreground-scripts
            npm run build
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            export PATH="$PATH:/usr/local/bin:$HOME/.local/bin"
            pm2_bin=$(command -v pm2 || true)
            if [ -z "$pm2_bin" ]; then
              pm2_bin=$(ls -1 "$HOME"/.nvm/versions/node/*/bin/pm2 2>/dev/null | tail -n 1 || true)
            fi
            if [ -z "$pm2_bin" ]; then
              echo "pm2 not found; cannot restart nuania"
              exit 1
            fi
            if "$pm2_bin" describe nuania >/dev/null 2>&1; then
              "$pm2_bin" restart nuania --update-env
            else
              "$pm2_bin" start server/index.js --name nuania --update-env
            fi
            "$pm2_bin" save || true
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3001/api/me >/dev/null; then
                order_code=$(curl -s -o /tmp/media-order.json -w '%{http_code}' -X PUT \
                  http://127.0.0.1:3001/api/providers/1/media-order \
                  -H 'Content-Type: application/json' \
                  -d '{"ids":[1]}')
                if [ "$order_code" = "404" ]; then
                  echo "media-order route missing after deploy (HTTP $order_code)"
                  cat /tmp/media-order.json || true
                  "$pm2_bin" status || true
                  exit 1
                fi
                echo "Deployed and API is up (media-order HTTP $order_code)"
                exit 0
              fi
              sleep 2
            done
            echo "Service did not become ready"
            "$pm2_bin" status || true
            "$pm2_bin" logs nuania --lines 40 --nostream || true
            exit 1
